<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Pioneer Expedition - 過酷なる大遠征</title>
<style>
  body {
    margin: 0; background: #1e1b18; color: #f4f1ea;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    user-select: none;
  }
  #hud {
    width: 980px; background: #2c2623; padding: 10px 18px;
    border-bottom: 1px solid #554838; display: flex;
    justify-content: space-between; align-items: center;
    box-sizing: border-box; margin-top: 10px; border-radius: 8px 8px 0 0;
  }
  #inv-bar {
    width: 980px; background: #231f1c; padding: 8px 18px;
    border-bottom: 3px solid #8c7355; display: flex;
    align-items: center; gap: 12px; box-sizing: border-box;
  }
  .inv-label { font-size: 13px; font-weight: bold; color: #d4a373; }
  .inv-slots { display: flex; gap: 10px; flex: 1; }
  .inv-slot {
    background: #181512; border: 2px solid #554838; border-radius: 6px;
    padding: 4px 10px; min-width: 190px; height: 32px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; box-sizing: border-box;
  }
  .inv-slot.filled { border-color: #d4a373; background: #2b2520; }
  .inv-slot.empty { color: #665e54; font-style: italic; justify-content: center; border-style: dashed; }
  .slot-count { color: #ffba08; font-weight: bold; margin-left: 6px; }
  .btn-discard {
    background: #6a040f; color: #fff; border: none; padding: 2px 6px;
    border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 8px;
  }
  .btn-discard:hover { background: #9d0208; }

  .stat { font-size: 14px; font-weight: bold; }
  .san-bar-bg {
    width: 100px; height: 14px; background: #444;
    display: inline-block; vertical-align: middle; border-radius: 7px; overflow: hidden;
  }
  #san-bar { height: 100%; background: #4ea8de; width: 100%; transition: 0.2s; }
  #game-container { position: relative; width: 980px; height: 540px; }
  canvas {
    background: #141210; border: 2px solid #8c7355;
    cursor: pointer; display: block;
  }
  #log-bar {
    width: 980px; background: #2c2623; padding: 10px 18px;
    box-sizing: border-box; border-top: 1px solid #554838;
    border-radius: 0 0 8px 8px; font-size: 14px; color: #e0d8c8;
    min-height: 58px; line-height: 1.4;
  }
  .modal {
    display: none; position: absolute; top: 15px; left: 130px;
    width: 720px; background: #2b2520; border: 3px solid #d4a373;
    border-radius: 8px; padding: 18px 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.9);
    box-sizing: border-box;
  }
  .modal-title { font-size: 19px; font-weight: bold; color: #faedcd; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: #d4a373; margin-bottom: 12px; border-bottom: 1px solid #554838; padding-bottom: 8px; }
  .cat-header { font-size: 13px; color: #a89f91; background: #1e1b18; padding: 4px 10px; margin-top: 8px; border-left: 3px solid #d4a373; }
  .trade-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 6px; border-bottom: 1px solid #3d352e; font-size: 14px;
  }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold; }
  .badge-cheap { background: #1d3557; color: #a8dadc; border: 1px solid #4ea8de; }
  .badge-high { background: #6a040f; color: #ffba08; border: 1px solid #e85d04; }
  .badge-slot { background: #386641; color: #fff; }
  button {
    background: #8c7355; color: #fff; border: none; padding: 5px 12px;
    border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 4px; font-size: 13px;
  }
  button:hover { background: #b59874; }
  button:disabled { background: #3a3530; color: #666; cursor: not-allowed; }
  .btn-action { background: #386641; padding: 7px 14px; font-size: 13px; }
  .btn-action:hover { background: #6a994e; }
  .btn-ration { background: #7f4f24; padding: 7px 12px; font-size: 13px; border: 1px solid #b08968; }
  .btn-ration:hover { background: #9c6644; }
  .btn-goal { background: #ca6702; padding: 7px 14px; font-size: 13px; }
  .btn-goal:hover { background: #ee9b00; }
</style>
</head>
<body>

<div id="hud">
  <div class="stat">🧭 第<span id="exp-num">1</span>回遠征</div>
  <div class="stat">💰 資金: $<span id="cash-val">500</span></div>
  <div class="stat">
    🧠 SAN: <span id="san-val">100</span>/100
    <div class="san-bar-bg"><div id="san-bar"></div></div>
  </div>
  <button id="ration-btn" class="btn-ration" onclick="useRation()">🍫 携帯食料を使う (残:0)</button>
  <button id="action-btn" class="btn-action" onclick="handleLocationAction()">⚓ 補給所を開く</button>
</div>

<div id="inv-bar">
  <div class="inv-label">🎒 インベントリ (<span id="slot-used">0</span>/<span id="slot-max">3</span>枠):</div>
  <div class="inv-slots" id="inv-slots-container"></div>
  <div style="font-size:12px; color:#a89f91;">※同じアイテムは1枠に無限スタック可能</div>
</div>

<div id="game-container">
  <canvas id="mapCanvas" width="980" height="540"></canvas>

  <!-- 補給・交易ウィンドウ -->
  <div id="trade-modal" class="modal">
    <div class="modal-title" id="modal-title">交易ウィンドウ</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="trade-list"></div>
    <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center;">
      <button onclick="restSan()" id="rest-btn">⛺ 宿・集落で休む ($60でSAN全快)</button>
      <button class="btn-action" onclick="closeModal('trade-modal')">探索へ戻る</button>
    </div>
  </div>

  <!-- ゴール（遠征完了・精算）ウィンドウ -->
  <div id="goal-modal" class="modal">
    <div class="modal-title">🎈 帰還気球に到着！</div>
    <div class="modal-sub">過酷な未開地を生き延びました！持ち帰った特産品と余剰物資をすべて換金します。</div>
    <div id="settlement-list" style="margin: 12px 0; max-height: 260px; overflow-y: auto;"></div>
    <div id="settlement-total" style="font-size: 18px; font-weight: bold; color: #ffba08; text-align: right; padding: 10px 0; border-top: 2px solid #8c7355;"></div>
    <div style="margin-top: 14px; display: flex; justify-content: space-between;">
      <button onclick="closeModal('goal-modal')">まだ島を探索する（キャンセル）</button>
      <button class="btn-goal" onclick="finishExpedition()">💰 全額精算して次の未開の島へ！</button>
    </div>
  </div>
</div>

<div id="log-bar">💬 出発港(⚓)では携帯食料しか買えない！道中の「❓」で物資を拾い、集落(🏕️)を見つけて交易しよう！</div>

<script>
// ============================================================================
// [MODULE 1] 定数・マスターデータ定義
// ============================================================================
const COLS = 24, ROWS = 11, HEX_R = 24, HEX_W = Math.sqrt(3) * HEX_R;

const TERRAINS = {
  plain:    { name: "草原",       color: "#588157", icon: "",   cost: 4 },
  forest:   { name: "密林",       color: "#344e41", icon: "🌲", cost: 10 },
  swamp:    { name: "泥沼",       color: "#5c4d3c", icon: "🌿", cost: 18 },
  mountain: { name: "険しい山",   color: "#6c757d", icon: "⛰️", cost: 30 },
  port:     { name: "出発港",     color: "#1d3557", icon: "⚓", cost: 0 },
  village:  { name: "原住民集落", color: "#b56576", icon: "🏕️", cost: 0 },
  question: { name: "謎の地点",   color: "#7b2cbf", icon: "❓", cost: 4 },
  goal:     { name: "帰還気球",   color: "#ca6702", icon: "🎈", cost: 0 }
};

const ITEMS = [
  // type: 'supply' は出発港と集落の両方で表示・購入できる探検サバイバル品
  { id: 'ration', name: "🍫 携帯食料",   type: 'supply', base: 40,  owned: 0, costSum: 0 },
  // type: 'city' と 'local' は集落（🏕️）でのみ取引される交易品
  { id: 'med',    name: "💊 医療品",     type: 'city',   base: 50,  owned: 0, costSum: 0 },
  { id: 'tool',   name: "⚒️ 鉄の農具",   type: 'city',   base: 120, owned: 0, costSum: 0 },
  { id: 'cloth',  name: "🧶 絹織物",     type: 'city',   base: 260, owned: 0, costSum: 0 },
  { id: 'spice',  name: "🌶️ 希少香辛料", type: 'local',  base: 180, owned: 0, costSum: 0 },
  { id: 'jade',   name: "💎 翠玉(翡翠)", type: 'local',  base: 420, owned: 0, costSum: 0 },
  { id: 'relic',  name: "🏺 古代の遺物", type: 'local',  base: 900, owned: 0, costSum: 0 }
];

// ============================================================================
// [MODULE 2] ゲーム状態管理 ＆ インベントリスロット管理
// ============================================================================
let state = {
  expNum: 1, cash: 500, san: 100, maxSan: 100, maxSlots: 3,
  px: 1, py: 5, grid: [],
  selectedDestination: null, routePath: [], routeCost: 0
};

function getUsedSlots() {
  return ITEMS.filter(i => i.owned > 0).length;
}

function canCarryItem(item) {
  if (item.owned > 0) return true;
  return getUsedSlots() < state.maxSlots;
}

function discardItem(itemId) {
  let item = ITEMS.find(i => i.id === itemId);
  if (!item || item.owned <= 0) return;
  item.owned = 0;
  item.costSum = 0;
  document.getElementById('log-bar').innerText = `🗑️ ${item.name}をすべて破棄してインベントリの枠を空けた。`;
  if (document.getElementById('trade-modal').style.display === 'block') openTrade();
  render();
}

function generateIsland() {
  state.px = 1; state.py = 5; state.san = state.maxSan;
  state.selectedDestination = null; state.routePath = []; state.routeCost = 0;
  state.grid = [];
  for (let r = 0; r < ROWS; r++) {
    state.grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      let rand = Math.random();
      let type = rand < 0.45 ? 'plain' : (rand < 0.75 ? 'forest' : (rand < 0.90 ? 'swamp' : 'mountain'));
      state.grid[r][c] = { type: type, visited: false, villageData: null, questionUsed: false, eventType: null };
    }
  }
  state.grid[5][1].type = 'port';

  const vTemplates = [
    { cMin: 10, cMax: 16, name: "島の中央交易集落", specialty: 'jade', demand: 'tool' }
  ];
  vTemplates.forEach(t => {
    let c = t.cMin + Math.floor(Math.random() * (t.cMax - t.cMin + 1));
    let r = 1 + Math.floor(Math.random() * (ROWS - 2));
    state.grid[r][c].type = 'village';
    state.grid[r][c].villageData = { name: t.name, specialty: t.specialty, demand: t.demand };
  });

  const questionEvents = ['villageReveal', 'tradeItem', 'villageReveal', 'tradeItem', 'villageReveal', 'tradeItem'];
  questionEvents.forEach(eventType => {
    let c, r;
    do {
      c = 2 + Math.floor(Math.random() * 20);
      r = 1 + Math.floor(Math.random() * (ROWS - 2));
    } while (state.grid[r][c].type === 'port' || state.grid[r][c].type === 'village' || state.grid[r][c].type === 'question');
    state.grid[r][c].type = 'question';
    state.grid[r][c].eventType = eventType;
  });

  let goalR = 1 + Math.floor(Math.random() * (ROWS - 2));
  state.grid[goalR][22].type = 'goal';
  state.grid[goalR][22].visited = true;

  updateVision();
}

// ============================================================================
// [MODULE 3] 交易価格・サバイバル・精算ロジック
// ============================================================================
function getItemPriceInfo(item) {
  let cell = state.grid[state.py][state.px];
  if (item.type === 'supply') {
    let p = cell.type === 'port' ? item.base : 55;
    return { price: p, badge: '<span class="badge badge-cheap">移動中にSAN+25回復</span>', canBuy: true };
  }
  // 港ではサバイバル品以外は購入不可（表示もされない）
  if (cell.type === 'port') {
    return { price: item.base, badge: '', canBuy: false };
  }
  if (cell.type === 'village') {
    let v = cell.villageData;
    let dist = Math.hypot(state.px - 1, state.py - 5);
    let distMult = 1.15 + dist * 0.09;
    if (item.type === 'city') {
      if (v.demand === item.id) {
        return { price: Math.round(item.base * distMult * 1.6), badge: '<span class="badge badge-high">🔥集落で大需要!(超高値)</span>', canBuy: false };
      }
      return { price: Math.round(item.base * distMult), badge: '<span class="badge badge-high">集落の取引価格</span>', canBuy: true };
    } else {
      if (v.specialty === item.id) {
        return { price: Math.round(item.base * 0.65), badge: '<span class="badge badge-cheap">✨現地の名産品!(激安仕入)</span>', canBuy: true };
      }
      return { price: Math.round(item.base * 1.2), badge: '<span class="badge badge-high">他部族の特産品</span>', canBuy: false };
    }
  }
  return { price: item.base, badge: '', canBuy: false };
}

function useRation() {
  let ration = ITEMS.find(i => i.id === 'ration');
  if (ration.owned > 0 && state.san < state.maxSan && state.san > 0) {
    ration.owned--;
    ration.costSum = Math.max(0, ration.costSum - 40);
    state.san = Math.min(state.maxSan, state.san + 25);
    document.getElementById('log-bar').innerText = `🍫 携帯食料を食べて正気度(SAN)を +25 回復した！`;
    render();
  }
}

function openGoalModal() {
  let list = document.getElementById('settlement-list');
  list.innerHTML = "";
  let totalCargoValue = 0;

  ITEMS.forEach(it => {
    if (it.owned > 0) {
      let mult = it.type === 'local' ? 2.5 : 1.0;
      let unitPrice = Math.round(it.base * mult);
      let subTotal = unitPrice * it.owned;
      totalCargoValue += subTotal;
      let tag = it.type === 'local' ? '<span class="badge badge-high">本国への献上品 (x2.5倍!)</span>' : '<span class="badge badge-cheap">余剰物資の定価払戻し</span>';
      list.innerHTML += `
        <div class="trade-row">
          <div><b>${it.name}</b> x ${it.owned}個 ${tag}</div>
          <div>単価 $${unitPrice} ＝ <b style="color:#ffba08">+$${subTotal.toLocaleString()}</b></div>
        </div>`;
    }
  });
  if (totalCargoValue === 0) {
    list.innerHTML = `<div style="padding:15px; color:#aaa;">持ち帰った交易品はありません（手持ちの現金のみで帰還します）。</div>`;
  }
  let finalAsset = state.cash + totalCargoValue;
  document.getElementById('settlement-total').innerHTML =
    `積荷の換金合計: +$${totalCargoValue.toLocaleString()}<br>` +
    `精算後の総資金: $${finalAsset.toLocaleString()}`;
  document.getElementById('goal-modal').style.display = 'block';
}

function finishExpedition() {
  ITEMS.forEach(it => {
    if (it.owned > 0) {
      let mult = it.type === 'local' ? 2.5 : 1.0;
      state.cash += Math.round(it.base * mult) * it.owned;
      it.owned = 0; it.costSum = 0;
    }
  });
  state.expNum++;
  closeModal('goal-modal');
  generateIsland();
  render();
  document.getElementById('log-bar').innerHTML = `🎉 <b>生還成功！総資金 $${state.cash.toLocaleString()} を携えて、第${state.expNum}回遠征の島へ上陸した！</b>`;
  openTrade();
}

// ============================================================================
// [MODULE 4] Canvas描画 ＆ UIイベント制御
// ============================================================================
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

function hexCenter(c, r) {
  return { x: 42 + c * (HEX_R * 1.5), y: 40 + r * HEX_W + (c % 2 === 1 ? HEX_W / 2 : 0) };
}
function isAdjacent(c1, r1, c2, r2) {
  if (c1 === c2 && r1 === r2) return false;
  let p1 = hexCenter(c1, r1), p2 = hexCenter(c2, r2);
  return Math.hypot(p1.x - p2.x, p1.y - p2.y) < HEX_W * 1.15;
}
function updateVision() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let p1 = hexCenter(state.px, state.py), p2 = hexCenter(c, r);
      if (Math.hypot(p1.x - p2.x, p1.y - p2.y) <= HEX_W * 2.2) state.grid[r][c].visited = true;
    }
  }
}

function findShortestPath(targetC, targetR) {
  if (!state.grid[targetR][targetC].visited) return null;

  let distance = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
  let previous = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  let remaining = [];
  distance[state.py][state.px] = 0;
  remaining.push({ c: state.px, r: state.py });

  while (remaining.length > 0) {
    remaining.sort((a, b) => distance[a.r][a.c] - distance[b.r][b.c]);
    let current = remaining.shift();
    let currentDistance = distance[current.r][current.c];
    if (current.c === targetC && current.r === targetR) break;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (!state.grid[r][c].visited || !isAdjacent(current.c, current.r, c, r)) continue;
        let cost = currentDistance + TERRAINS[state.grid[r][c].type].cost;
        if (cost < distance[r][c]) {
          distance[r][c] = cost;
          previous[r][c] = current;
          remaining.push({ c, r });
        }
      }
    }
  }

  if (!Number.isFinite(distance[targetR][targetC])) return null;
  let path = [];
  let cursor = { c: targetC, r: targetR };
  while (cursor) {
    path.unshift(cursor);
    if (cursor.c === state.px && cursor.r === state.py) break;
    cursor = previous[cursor.r][cursor.c];
  }
  return { path, ...getRouteCost(path) };
}

function getRouteCost(path) {
  let steps = path.length - 1;
  let baseCost = path.slice(1).reduce((total, point) => {
    return total + TERRAINS[state.grid[point.r][point.c].type].cost;
  }, 0);
  let discount = steps >= 2 ? Math.floor((steps - 1) * (1 + steps / 10)) : 0;
  return {
    steps,
    baseCost,
    discount,
    cost: Math.max(1, baseCost - discount)
  };
}

function triggerQuestionEvent(cell) {
  if (cell.questionUsed) return "❓ ここにはもう何も残っていない。";

  if (cell.eventType === 'villageReveal') {
    cell.questionUsed = true;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (state.grid[r][c].type === 'village') state.grid[r][c].visited = true;
      }
    }
    return "❓ 古い地図を発見した！🏕️ 村の位置がマップに記された。";
  }

  let tradeItems = ITEMS.filter(item => item.type === 'city' || item.type === 'local');
  let item = tradeItems[Math.floor(Math.random() * tradeItems.length)];

  if (!canCarryItem(item)) {
    return `❓ ${item.name}を発見したが、インベントリ(${state.maxSlots}枠)が満杯で拾えなかった！（不要な枠を×で破棄しよう）`;
  }

  cell.questionUsed = true;
  item.owned++;
  return `❓ 遺された交易品を発見した！${item.name}を1個手に入れた。`;
}

function drawHex(x, y, radius, fill, stroke, lineWidth = 2) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    let angle = Math.PI / 3 * i;
    let hx = x + radius * Math.cos(angle), hy = y + radius * Math.sin(angle);
    if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke();
}

function renderInventoryBar() {
  let heldItems = ITEMS.filter(i => i.owned > 0);
  document.getElementById('slot-used').innerText = heldItems.length;
  document.getElementById('slot-max').innerText = state.maxSlots;

  let container = document.getElementById('inv-slots-container');
  container.innerHTML = "";

  for (let s = 0; s < state.maxSlots; s++) {
    if (s < heldItems.length) {
      let it = heldItems[s];
      container.innerHTML += `
        <div class="inv-slot filled">
          <div><b>${it.name}</b> <span class="slot-count">x${it.owned}</span></div>
          <button class="btn-discard" title="この枠のアイテムをすべて捨てて枠を空ける" onclick="discardItem('${it.id}')">×破棄</button>
        </div>`;
    } else {
      container.innerHTML += `<div class="inv-slot empty">空きスロット</div>`;
    }
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let { x, y } = hexCenter(c, r);
      let cell = state.grid[r][c];
      let adj = isAdjacent(state.px, state.py, c, r);

      if (!cell.visited) {
        drawHex(x, y, HEX_R - 1, "#22201e", "#33302c", 1);
        ctx.font = "11px sans-serif"; ctx.fillStyle = "#555"; ctx.fillText("☁️", x, y);
        continue;
      }
      let t = cell.type === 'question' && cell.questionUsed ? TERRAINS.plain : TERRAINS[cell.type];
      drawHex(x, y, HEX_R - 1, t.color, adj ? "#e9c46a" : "#1e1b18", adj ? 2.5 : 1.5);
      let onRoute = state.routePath.some(point => point.c === c && point.r === r);
      if (onRoute) {
        drawHex(x, y, HEX_R + 1, "rgba(0,0,0,0)", pointMatchesDestination(c, r) ? "#ffba08" : "#f4a261", pointMatchesDestination(c, r) ? 4 : 2);
      }
      if (t.icon) { ctx.font = "16px sans-serif"; ctx.fillText(t.icon, x, y - 3); }
      if (cell.type === 'village' && cell.villageData) {
        let spIcon = ITEMS.find(i => i.id === cell.villageData.specialty).name.slice(0, 2);
        ctx.font = "10px sans-serif"; ctx.fillText(spIcon, x + 9, y - 9);
      }
      if (t.cost > 0 && adj) {
        ctx.font = "bold 10px sans-serif"; ctx.fillStyle = "#ffccd5";
        ctx.fillText(`-${t.cost}`, x, y + 12);
      }
    }
  }
  let pPos = hexCenter(state.px, state.py);
  ctx.font = "20px sans-serif"; ctx.fillText("🤠", pPos.x, pPos.y - 1);

  document.getElementById('exp-num').innerText = state.expNum;
  document.getElementById('cash-val').innerText = state.cash.toLocaleString();
  document.getElementById('san-val').innerText = state.san;
  document.getElementById('san-bar').style.width = `${Math.max(0, state.san)}%`;
  document.getElementById('san-bar').style.background = state.san > 30 ? "#4ea8de" : "#e63946";

  let ration = ITEMS.find(i => i.id === 'ration');
  let rBtn = document.getElementById('ration-btn');
  rBtn.innerText = `🍫 携帯食料を使う (残:${ration.owned})`;
  rBtn.disabled = (ration.owned <= 0 || state.san >= state.maxSan || state.san <= 0);

  renderInventoryBar();

  let curType = state.grid[state.py][state.px].type;
  let btn = document.getElementById('action-btn');
  if (curType === 'goal') {
    btn.disabled = false; btn.className = "btn-goal"; btn.innerText = "🎈 帰還・精算する";
  } else if (curType === 'port') {
    btn.disabled = false; btn.className = "btn-action"; btn.innerText = "⚓ 補給所を開く";
  } else if (curType === 'village') {
    btn.disabled = false; btn.className = "btn-action"; btn.innerText = "🏕️ 交易を開く";
  } else {
    btn.disabled = true; btn.className = "btn-action"; btn.innerText = "移動中...";
  }
}

function pointMatchesDestination(c, r) {
  return state.selectedDestination && state.selectedDestination.c === c && state.selectedDestination.r === r;
}

function moveAlongRoute(path, cost) {
  if (cost > state.san) {
    document.getElementById('log-bar').innerText = `💬 その経路にはSANが足りない（必要:${cost} / 残り:${state.san}）。`;
    return;
  }

  state.routePath = [];
  state.selectedDestination = null;
  let traveledPath = [path[0]];
  for (let i = 1; i < path.length; i++) {
    state.px = path[i].c;
    state.py = path[i].r;
    traveledPath.push(path[i]);
    let cell = state.grid[state.py][state.px];
    if (cell.type === 'goal' || cell.type === 'port' || cell.type === 'village') break;
  }
  let actualRoute = getRouteCost(traveledPath);
  state.san = Math.max(0, state.san - actualRoute.cost);
  updateVision();
  let cell = state.grid[state.py][state.px];
  if (state.san <= 0) {
    render();
    document.getElementById('log-bar').innerHTML = "💀 <b style='color:#e63946'>正気度(SAN)が尽き、調査隊は未開の密林へ消えた… (F5で最初から再挑戦)</b>";
    return;
  }

  let eventLogs = [];
  for (let point of traveledPath.slice(1)) {
    let passedCell = state.grid[point.r][point.c];
    if (passedCell.type === 'question' && !passedCell.questionUsed) {
      eventLogs.push(triggerQuestionEvent(passedCell));
    }
  }
  let eventHtml = eventLogs.length > 0 ? `<br><span style="color:#ffd166; font-weight:bold;">${eventLogs.join(" / ")}</span>` : "";

  if (cell.type === 'goal') {
    render();
    document.getElementById('log-bar').innerHTML = `🎈 <b>帰還気球に到着！</b> 持ち帰った特産品を精算して遠征を完了しよう！${eventHtml}`;
    openGoalModal();
    return;
  }
  if (cell.type === 'port' || cell.type === 'village') {
    render();
    document.getElementById('log-bar').innerHTML = `💬 ${TERRAINS[cell.type].name}に到着した（連続${actualRoute.steps}マス、割引 -${actualRoute.discount}）。${eventHtml}`;
    openTrade();
    return;
  }
  render();
  document.getElementById('log-bar').innerHTML = `💬 目的地に到着した（連続${actualRoute.steps}マス、SAN -${actualRoute.cost} / 割引 -${actualRoute.discount}）。${eventHtml}`;
}

function handleLocationAction() {
  let curType = state.grid[state.py][state.px].type;
  if (curType === 'goal') openGoalModal();
  else if (curType === 'port' || curType === 'village') openTrade();
}

canvas.addEventListener('click', (e) => {
  if (state.san <= 0) return;
  if (document.getElementById('trade-modal').style.display === 'block' ||
      document.getElementById('goal-modal').style.display === 'block') return;

  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let { x, y } = hexCenter(c, r);
      if (Math.hypot(mx - x, my - y) < HEX_R * 0.9 && c === state.px && r === state.py) return;
      if (Math.hypot(mx - x, my - y) < HEX_R * 0.9 && state.grid[r][c].visited) {
        let route = findShortestPath(c, r);
        if (!route) return;
        if (pointMatchesDestination(c, r)) {
          moveAlongRoute(route.path, route.cost);
        } else {
          state.selectedDestination = { c, r };
          state.routePath = route.path;
          state.routeCost = route.cost;
          render();
          document.getElementById('log-bar').innerText = `💬 目的地を選択：必要SAN -${route.cost}（連続${route.steps}マス、割引 -${route.discount}）。もう一度クリックで移動。`;
        }
        return;
      }
    }
  }
});

function openTrade() {
  let cell = state.grid[state.py][state.px];
  let isPort = (cell.type === 'port');
  let used = getUsedSlots();
  let slotStatus = `【インベントリ: ${used} / ${state.maxSlots} 枠】`;

  if (isPort) {
    document.getElementById('modal-title').innerText = `⚓ 出発港の補給所 ${slotStatus}`;
    document.getElementById('modal-sub').innerText = "ここでは探検用のサバイバル物資（携帯食料）のみ購入できます。交易品は道中の「❓」や集落で入手しましょう！";
  } else {
    let v = cell.villageData;
    let spName = ITEMS.find(i => i.id === v.specialty).name;
    let dmName = ITEMS.find(i => i.id === v.demand).name;
    document.getElementById('modal-title').innerText = `🏕️ ${v.name} ${slotStatus}`;
    document.getElementById('modal-sub').innerHTML = `名産品: <b>${spName}</b>（激安仕入） ／ 大需要: <b>${dmName}</b>（高額買取）`;
  }

  let list = document.getElementById('trade-list');
  list.innerHTML = `<div class="cat-header">【サバイバル物資】移動中にいつでも使ってSAN値を回復できる命綱</div>`;

  ITEMS.forEach((it, idx) => {
    // 港にいる時はサバイバル物資（supply）以外のアイテム行をすべてスキップして非表示にする！
    if (isPort && it.type !== 'supply') return;

    if (!isPort && idx === 1) list.innerHTML += `<div class="cat-header">【文明の物資】道中で拾うか集落間で売買して資金を作る</div>`;
    if (!isPort && idx === 4) list.innerHTML += `<div class="cat-header">【現地の特産品】集落で仕入れ ➔ 東端の帰還気球(🎈)で x2.5倍 精算！</div>`;

    let info = getItemPriceInfo(it);
    let avg = it.owned > 0 ? `(取得:$${Math.round(it.costSum / it.owned)})` : "";
    let slotAllowed = canCarryItem(it);
    let slotTag = it.owned > 0 ? '<span class="badge badge-slot">スタック中</span>' : (!slotAllowed ? '<span class="badge" style="background:#555;color:#ccc;">枠満杯</span>' : '');

    list.innerHTML += `
      <div class="trade-row">
        <div><b>${it.name}</b> ${info.badge} ${slotTag}</div>
        <div>価格: <b style="color:#e9c46a">$${info.price}</b> | 所持: <b>${it.owned}</b>個 <span style="font-size:12px;color:#aaa;">${avg}</span></div>
        <div>
          <button onclick="buyItem(${idx}, ${info.price})" ${(!info.canBuy || state.cash < info.price || !slotAllowed) ? 'disabled' : ''}>買う</button>
          <button onclick="buyMax(${idx}, ${info.price})" ${(!info.canBuy || state.cash < info.price || !slotAllowed) ? 'disabled' : ''}>全力買い</button>
          <button onclick="sellItem(${idx}, ${info.price})" ${it.owned <= 0 ? 'disabled' : ''}>1個売る</button>
          <button onclick="sellAll(${idx}, ${info.price})" ${it.owned <= 0 ? 'disabled' : ''}>すべて売る</button>
        </div>
      </div>`;
  });
  document.getElementById('rest-btn').disabled = (state.cash < 60 || state.san >= state.maxSan);
  document.getElementById('trade-modal').style.display = 'block';
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; render(); }
function buyItem(idx, price) {
  let item = ITEMS[idx];
  if (state.cash >= price && canCarryItem(item)) {
    state.cash -= price; item.owned++; item.costSum += price; openTrade(); render();
  }
}
function buyMax(idx, price) {
  let item = ITEMS[idx];
  let n = Math.floor(state.cash / price);
  if (n > 0 && canCarryItem(item)) {
    state.cash -= price * n; item.owned += n; item.costSum += price * n; openTrade(); render();
  }
}
function sellItem(idx, price) {
  let item = ITEMS[idx];
  if (item.owned > 0) {
    let unitCost = item.costSum / item.owned;
    state.cash += price;
    item.owned--;
    item.costSum = Math.max(0, item.costSum - unitCost);
    openTrade();
    render();
  }
}
function sellAll(idx, price) {
  let item = ITEMS[idx];
  if (item.owned > 0) {
    state.cash += price * item.owned;
    item.owned = 0;
    item.costSum = 0;
    openTrade();
    render();
  }
}
function restSan() { if (state.cash >= 60 && state.san < state.maxSan) { state.cash -= 60; state.san = state.maxSan; openTrade(); render(); } }

generateIsland(); render(); openTrade();
</script>
